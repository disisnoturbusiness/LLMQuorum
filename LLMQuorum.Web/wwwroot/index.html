<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLMQuorum</title>
<style>
  :root {
    --bg:#11131a; --panel:#181b24; --line:#272b38; --text:#e6e8ef;
    --dim:#8b93a7; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#7dd3fc;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  nav a { color:var(--dim); text-decoration:none; margin-right:14px; font-size:13px; }
  nav a:hover, nav a.on { color:var(--text); }
  main { padding:20px; max-width:1100px; }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button, select { background:#222634; color:var(--text); border:1px solid var(--line);
                   border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .muted { color:var(--dim); }
  .mono { font-family:ui-monospace,Consolas,monospace; }

  /* Verdict rendering: the answer leads, attribution sits under it in small text. */
  .verdict { padding:12px 0; border-bottom:1px solid var(--line); }
  .verdict:last-child { border-bottom:none; }
  .q { color:var(--dim); font-size:12.5px; margin-bottom:7px; }
  .answer { font-size:14.5px; margin-bottom:2px; }
  .providers { font-size:11.5px; color:var(--dim); margin-bottom:9px; letter-spacing:.2px; }
  .tag { font-size:10.5px; padding:2px 7px; border-radius:10px; letter-spacing:.5px;
         font-weight:600; margin-right:8px; }
  .t-quorum { background:rgba(74,222,128,.13); color:var(--ok); }
  .t-unresolved { background:rgba(251,191,36,.13); color:var(--warn); }
  .t-failed { background:rgba(248,113,113,.13); color:var(--bad); }
  .sig { font-family:ui-monospace,Consolas,monospace; color:var(--dim); font-size:11.5px; }
  .empty { color:var(--dim); padding:18px 0; }
</style>
</head>
<body>
<header>
  <h1>LLM<span>Quorum</span></h1>
  <nav>
    <a href="#" data-view="runs" class="on">Runs</a>
    <a href="#" data-view="panel">Panel</a>
    <a href="#" data-view="profile">Profile</a>
    <a href="/jobs" target="_blank">Jobs &#8599;</a>
  </nav>
</header>
<main id="main"><div class="empty">Loading&hellip;</div></main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const main = $('#main');
let currentView = 'runs';

const get  = (u)    => fetch(u).then(r => r.json());
const post = (u, b) => fetch(u, { method:'POST', headers:{'Content-Type':'application/json'},
                                  body: JSON.stringify(b) }).then(r => r.json());

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Renders one question's verdict. When quorum is reached a single answer leads
   with its providers beneath it. When unresolved, EVERY cluster is shown the
   same way, because the spread is the finding and hiding it would imply a
   confidence the panel did not earn. */
function renderVerdict(r) {
  const outcome = (r.Outcome || 'PENDING').toLowerCase();
  let clusters = [];
  try { clusters = JSON.parse(r.ClustersJson || '[]'); } catch { clusters = []; }

  const body = clusters.length
    ? clusters.map(c => `
        <div class="answer">${esc(c.Answer)}</div>
        <div class="providers">${c.ProviderKeys.map(esc).join(' &middot; ')}</div>`).join('')
    : '<div class="answer muted">no usable answers</div>';

  return `<div class="verdict">
    <div class="q">${r.Ordinal}. ${esc(r.Prompt)}</div>
    <div>
      <span class="tag t-${outcome}">${esc(r.Outcome || 'PENDING')}</span>
      <span class="sig">${esc(r.PartitionSig || '')} &middot; ${r.ProvidersAsked ?? 0} asked</span>
    </div>
    <div style="margin-top:8px">${body}</div>
    ${r.ExpectedAnswer ? `<div class="providers">key: ${esc(r.ExpectedAnswer)}</div>` : ''}
  </div>`;
}

async function viewRuns() {
  const [runs, sets] = await Promise.all([get('/api/runs'), get('/api/question-sets')]);
  const options = sets.map(s =>
    `<option value="${s.QuestionSetId}">${esc(s.Name)} (${s.QuestionCount})</option>`).join('');

  main.innerHTML = `
    <div class="card">
      <div class="row">
        <select id="setSel">${options || '<option value="">no question sets</option>'}</select>
        <button id="runBtn" ${sets.length ? '' : 'disabled'}>Run sweep</button>
        <span class="muted" id="runMsg"></span>
      </div>
    </div>
    <div class="card">
      <table><thead><tr><th>Run</th><th>Set</th><th>Label</th><th>Started</th><th>Qs</th><th></th></tr></thead>
      <tbody>${runs.map(r => `<tr>
        <td class="mono">${r.RunId}</td><td>${esc(r.SetName)}</td><td>${esc(r.Label || '')}</td>
        <td class="muted">${new Date(r.StartedUtc + 'Z').toLocaleString()}</td>
        <td>${r.Questions}</td>
        <td><button data-run="${r.RunId}">View</button></td></tr>`).join('')
        || '<tr><td colspan="6" class="empty">No runs yet.</td></tr>'}</tbody></table>
    </div>
    <div id="detail"></div>`;

  $('#runBtn')?.addEventListener('click', async () => {
    const id = Number($('#setSel').value);
    if (!id) return;
    $('#runBtn').disabled = true;
    await post('/api/runs', { questionSetId: id, label: 'portal ' + new Date().toISOString().slice(0,16) });
    $('#runMsg').textContent = 'queued - watch Jobs, then refresh';
    setTimeout(() => { $('#runBtn').disabled = false; }, 2000);
  });

  main.querySelectorAll('[data-run]').forEach(b => b.addEventListener('click', () => showRun(b.dataset.run)));
}

/* A replayed run holds several verdicts per question, one per rule set. The
   picker chooses which to display; without it the same question would appear
   once per matcher version and read as duplicates. */
async function showRun(runId, matcher) {
  const qs = matcher ? ('?matcher=' + encodeURIComponent(matcher)) : '';
  const [rows, matchers] = await Promise.all([
    get(`/api/runs/${runId}${qs}`), get(`/api/runs/${runId}/matchers`)]);

  const picker = matchers.length > 1
    ? `<div class="row" style="margin-bottom:10px">
         <span class="muted">rules:</span>
         ${matchers.map(m => `<button data-m="${esc(m.MatcherVersion)}"
            ${m.MatcherVersion === (matcher || rows[0]?.MatcherVersion) ? 'style="border-color:var(--accent)"' : ''}
            >${esc(m.MatcherVersion)}</button>`).join('')}
       </div>` : '';

  $('#detail').innerHTML = `<div class="card">${picker}${rows.map(renderVerdict).join('')
    || '<div class="empty">No questions recorded.</div>'}</div>`;

  $('#detail').querySelectorAll('[data-m]').forEach(x =>
    x.addEventListener('click', () => showRun(runId, x.dataset.m)));
}

async function viewPanel() {
  const p = await get('/api/panel');
  main.innerHTML = `
    <div class="card">
      <div class="muted">Ask the first ${p.Panel.BaseCount}. Escalate until an answer holds
      ${p.Panel.QuorumSize} votes, or the ladder runs out.
      Rules: <span class="mono">${esc(p.Panel.MatcherVersion)}</span></div>
    </div>
    <div class="card">
      <table><thead><tr><th>#</th><th>Provider</th><th>Model</th><th>Lab</th></tr></thead>
      <tbody>${p.Ladder.map(x => `<tr>
        <td class="mono">${x.LadderPosition}</td><td>${esc(x.DisplayName)}</td>
        <td class="mono">${esc(x.ModelId)}</td><td>${esc(x.Lab)}</td></tr>`).join('')}</tbody></table>
      ${p.Disabled.length ? `<div class="providers" style="margin-top:10px">
        disabled: ${p.Disabled.map(esc).join(' &middot; ')}</div>` : ''}
    </div>`;
}

async function viewProfile() {
  const rows = await get('/api/profile');
  main.innerHTML = `<div class="card">
    <table><thead><tr><th>Provider</th><th>Lab</th><th>Category</th><th>Calls</th>
    <th>OK</th><th>429</th><th>Avg ms</th><th>In winning cluster</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.ProviderKey)}</td><td class="muted">${esc(r.Lab)}</td>
      <td>${esc(r.Category)}</td><td>${r.CallsAnswered}</td><td>${r.Successes}</td>
      <td>${r.RateLimited}</td><td class="muted">${r.AvgLatencyMs ?? ''}</td>
      <td>${r.JoinedWinningCluster}</td></tr>`).join('')
      || '<tr><td colspan="8" class="empty">No calls recorded yet.</td></tr>'}</tbody></table>
  </div>`;
}

const views = { runs: viewRuns, panel: viewPanel, profile: viewProfile };

document.querySelectorAll('nav a[data-view]').forEach(a =>
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('nav a').forEach(x => x.classList.remove('on'));
    a.classList.add('on');
    currentView = a.dataset.view;
    views[currentView]();
  }));

views[currentView]();
</script>
</body>
</html>
